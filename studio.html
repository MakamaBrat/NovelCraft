</style></head><body><div id="app"></div><script>

function render(){const a=$('#app'),m=$('#m');a.innerHTML='';const s=st.s;

function list(p,t){const k=st.tab,L=k=='chars'&&st.f=='main'?p[k].filter(o=>o.main):p[k];if(!L.length)return`<p class="empty">Пока пусто — нажми «+»</p>`;

 tab(i){st.tab=i;render()},opens(i){st.sc=i;st.s='script';render()},
 add(){const k=st.tab,t=TABS[k],o={id:uid()};if(k=='scripts')o.nodes=[];form('Новый: '+t[0],t[2],o,x=>P()[k].push(x))},
 edit(i){const k=st.tab,t=TABS[k],L=P()[k],o=L.find(x=>x.id==i);form(t[0],t[2],o,()=>0,()=>L.splice(L.indexOf(o),1))},
 addn(){addNode($('#nt').value)},edn(i){st.n=i;st.s='node';render()},up(i,e){const L=S().nodes,k=L.findIndex(n=>n.id==i);if(k>0){[L[k-1],L[k]]=[L[k],L[k-1]];save();render()}},
 deln(){ask('Удалить блок?',()=>{const L=S().nodes,id=st.n;L.splice(L.findIndex(n=>n.id==id),1);L.forEach(n=>{['next','then','else'].forEach(k=>{if(n[k]==id)n[k]=''});(n.opts||[]).forEach(o=>{if(o.goto==id)o.goto=''})});save();act.script()})},
 send(){const t=$('#tx').value.trim();if(!t)return;N().lines.push({w:$('#sp').value,t});save();const w=$('#sp').value;render();$('#sp').value=w;$('#tx').focus()},
 dell(i){N().lines.splice(i,1);save();render()},addo(){N().opts.push({text:'',goto:''});save();render()},delo(i){N().opts.splice(i,1);save();render()},
 play(i){if(!S().nodes.length)return toast('Добавь хотя бы один блок');const V={};P().vars.forEach(v=>V[v.name]=num(v.val));P().items.forEach(x=>V[x.name]=0);const f=S().nodes.find(n=>n.id==i)?i:'';pl={V,id:f||S().nodes[0].id,i:0,h:[],from:f,dbg:pl.dbg};st.s='play';step()},
 tap(){snap();pl.i++;step()},pick(i){snap();go(N_().opts[i].goto);step()}};
const snap=()=>pl.h.push({V:{...pl.V},id:pl.id,i:pl.i,st:pl.st,end:pl.end});
const N_=()=>S().nodes.find(x=>x.id==pl.id);
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;e.stopPropagation();act[b.dataset.a]?.(b.dataset.i,e)});
$('#app').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(t.id=='tt'&&t.value){$('#tx').value=P().texts.find(z=>z.id==t.value).body;t.value='';return}if(!k)return;const n=N(),o=t.dataset.o!=null?n.opts[t.dataset.o]:n;o[k]=t.value;save();if(k=='L'||k=='R')render()});
$('#app').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='tx')act.send()});
fixSt();render();
</script></body></html>
